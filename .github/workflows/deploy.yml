name: Deploy to Hugging Face

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

          rm -rf hf_space

          git clone https://Medina07:$HF_TOKEN@huggingface.co/spaces/Medina07/traffic-signs-cnn hf_space

          rsync -av --exclude='.git' ./hf_space/ hf_space/

          # 🔴 FIX CRÍTICO: generar README válido (evita error de configuración)
          echo "---" > hf_space/README.md
          echo "title: Detector de Señales de Tránsito" >> hf_space/README.md
          echo "emoji: 🚦" >> hf_space/README.md
          echo "colorFrom: red" >> hf_space/README.md
          echo "colorTo: blue" >> hf_space/README.md
          echo "sdk: gradio" >> hf_space/README.md
          echo "sdk_version: \"4.16.0\"" >> hf_space/README.md
          echo "app_file: app.py" >> hf_space/README.md
          echo "pinned: false" >> hf_space/README.md
          echo "license: mit" >> hf_space/README.md
          echo "---" >> hf_space/README.md
          echo "" >> hf_space/README.md
          echo "# Detector de Señales de Tránsito" >> hf_space/README.md
          echo "" >> hf_space/README.md
          echo "Aplicación de visión computacional que detecta señales de tránsito usando CNN (GTSRB - 43 clases) y responde preguntas con un modelo BERT en español." >> hf_space/README.md

          cd hf_space

          git add .

          git commit -m "Deploy from GitHub Actions" || echo "No changes"

          git push